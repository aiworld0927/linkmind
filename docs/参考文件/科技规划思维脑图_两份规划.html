const PALETTE = ["#1d4ed8","#0f766e","#b45309","#7e22ce","#b91c1c","#0369a1","#4d7c0f","#a16207"];
const ROWGAP = 11, GAPX = 58;
const DEPTH_W = [258, 222, 208, 250, 250];
const DEPTH_FS = [19, 16, 14, 13.5, 13];
const DEPTH_H = [42, 36, 32, 30, 30];

let cur = 0, collapsed = new Set(), view = {k: 1, x: 24, y: 24};
let nodes = [], links = [], totalW = 0, totalH = 0, svg, vg, stage;

function initTabs(){
  const box = document.getElementById('tabs');
  MAPS.forEach((m,i)=>{
    const b = document.createElement('div');
    b.className = 'tab' + (i===0?' on':'');
    b.textContent = m.title;
    b.onclick = ()=>{ cur = i; collapsed.clear(); [...box.children].forEach((c,j)=>c.className='tab'+(j===i?' on':'')); build(); };
    box.appendChild(b);
  });
}

function charW(ch, fs){ return /[\u3000-\u9fff\uff01-\uffef]/.test(ch) ? fs : fs*0.56; }

function wrap(text, w, fs){
  const maxW = w - 18, lines = [];
  let line = '', lw = 0;
  for (const ch of text){
    const cw = charW(ch, fs);
    if (lw + cw > maxW && line){ lines.push(line); line=''; lw=0; }
    line += ch; lw += cw;
  }
  if (line) lines.push(line);
  return lines;
}

function build(){
  const root = JSON.parse(JSON.stringify(MAPS[cur].root));
  let uid = 0;
  nodes = []; links = [];

  // 生成 id 与层级
  (function tag(n, d, parent, top){
    n.id = 'n' + (uid++); n.d = d; n.parent = parent; n.top = top;
    nodes.push(n);
    if (n.c){ n.c.forEach((c,i)=>tag(c, d+1, n, d===0 ? i : top)); }
  })(root, 0, null, 0);

  // x 坐标
  const xOff = [0];
  for (let d=1; d<6; d++) xOff[d] = xOff[d-1] + (DEPTH_W[d-1]||246) + GAPX;

  // y 坐标
  let cursor = 0;
  nodes.forEach(n=> n.vis = false);
  (function place(n){
    const fs = DEPTH_FS[n.d], w = DEPTH_W[n.d]||246;
    n.vis = true;
    n.lines = wrap(n.t, w, fs);
    const h = Math.max(DEPTH_H[n.d]||30, n.lines.length * (fs+5) + 12);
    const kids = (n.c && n.c.length && !collapsed.has(n.id)) ? n.c : null;
    n.w = w; n.h = h;
    if (!kids){
      n.y = cursor + h/2; cursor += h + ROWGAP; return n.y;
    }
    const ys = kids.map(place);
    n.y = (ys[0] + ys[ys.length-1]) / 2;
    return n.y;
  })(root);

  // assign x offsets
  nodes.forEach(n=> n.off = xOff[n.d] || 0);

  totalH = cursor;
  totalW = xOff[[...nodes].reduce((m,n)=>Math.max(m,n.d),0)] + 260;

  render();
}

function render(){
  vg.innerHTML = '';
  const q = document.getElementById('q').value.trim();

  // 连线
  nodes.forEach(n=>{
    if (!n.vis) return;
    if (!n.c || collapsed.has(n.id)) return;
    n.c.forEach(c=>{
      if (!c.vis) return;
      const x1 = n.off + n.w, y1 = n.y, x2 = c.off, y2 = c.y;
      const mid = (x1 + x2)/2;
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', `M${x1} ${y1} C${mid} ${y1} ${mid} ${y2} ${x2} ${y2}`);
      p.setAttribute('fill','none');
      p.setAttribute('stroke', PALETTE[(n.d===0 ? (n.c.indexOf(c)) : n.top) % PALETTE.length]);
      p.setAttribute('stroke-opacity', n.d===0 ? 0.55 : 0.32);
      p.setAttribute('stroke-width', n.d===0 ? 2.2 : 1.3);
      vg.appendChild(p);
    });
  });

  // 节点
  nodes.forEach(n=>{
    if (!n.vis) return;
    const color = PALETTE[(n.d===0 ? 0 : n.top) % PALETTE.length];
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','nt');
    g.setAttribute('transform', `translate(${n.off||0},${n.y - n.h/2})`);
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('width', n.w); rect.setAttribute('height', n.h);
    rect.setAttribute('rx', n.d<=1 ? 9 : 7);
    if (n.d === 0){ rect.setAttribute('fill', '#1f2d3d'); }
    else if (n.d === 1){ rect.setAttribute('fill', color); rect.setAttribute('fill-opacity','0.92'); }
    else if (n.d === 2){ rect.setAttribute('fill','#ffffff'); rect.setAttribute('stroke', color); rect.setAttribute('stroke-width','1.2'); }
    else { rect.setAttribute('fill','#ffffff'); rect.setAttribute('stroke','#b9c4d4'); rect.setAttribute('stroke-width','1'); }
    if (q && n.t.indexOf(q) >= 0){ rect.setAttribute('fill','#fff7cc'); rect.setAttribute('stroke','#f59e0b'); rect.setAttribute('stroke-width','2'); }
    g.appendChild(rect);

    const fs = DEPTH_FS[n.d];
    const lh = fs + 5;
    const startY = n.h/2 - (n.lines.length-1)*lh/2;
    n.lines.forEach((ln,i)=>{
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', n.d<=1 ? 12 : 9);
      t.setAttribute('y', startY + i*lh);
      t.setAttribute('font-size', fs);
      t.setAttribute('fill', n.d===0 ? '#fff' : (n.d===1 ? '#fff' : '#1f2d3d'));
      t.setAttribute('font-weight', n.d<=1 ? 700 : 400);
      t.textContent = ln;
      g.appendChild(t);
    });

    // 折叠标记
    if (n.c && n.c.length){
      const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx', n.w - 11); dot.setAttribute('cy', n.h/2);
      dot.setAttribute('r', collapsed.has(n.id) ? 4.5 : 3);
      dot.setAttribute('fill', collapsed.has(n.id) ? '#f59e0b' : '#cbd5e1');
      g.appendChild(dot);
    }

    g.onclick = (e)=>{ e.stopPropagation(); if (!n.c || !n.c.length) return;
      collapsed.has(n.id) ? collapsed.delete(n.id) : collapsed.add(n.id); build(); };

    vg.appendChild(g);
  });

  applyView();
}

function applyView(){
  vg.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
}

function fit(){
  const W = stage.clientWidth, H = stage.clientHeight;
  let k = Math.min((W-40)/totalW, (H-40)/totalH);
  k = Math.max(0.12, Math.min(k, 1.05));
  if (k < 0.5) k = 0.6;
  view = {k: k, x: 20, y: 20};
  applyView();
}

function zoom(f){ view.k = Math.max(0.1, Math.min(2.6, view.k*f)); applyView(); }

function expandAll(){
  nodes.forEach(n=>{ if(n.c&&n.c.length) collapsed.delete(n.id); });
  build();
}
function toLevel(d){
  collapsed.clear();
  nodes.forEach(n=>{ if (n.d>=d && n.c && n.c.length) collapsed.add(n.id); });
  build(); fit();
}

function bindStage(){
  let drag = null;
  stage.addEventListener('mousedown', e=>{ drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y}; stage.classList.add('drag'); });
  window.addEventListener('mousemove', e=>{ if(!drag) return; view.x = drag.vx + (e.clientX-drag.x); view.y = drag.vy + (e.clientY-drag.y); applyView(); });
  window.addEventListener('mouseup', ()=>{ drag=null; stage.classList.remove('drag'); });
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.12 : 0.89;
    const rect = stage.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const nk = Math.max(0.1, Math.min(2.6, view.k*f));
    view.x = mx - (mx - view.x) * (nk/view.k);
    view.y = my - (my - view.y) * (nk/view.k);
    view.k = nk; applyView();
  }, {passive:false});

  const q = document.getElementById('q');
  q.addEventListener('input', ()=>{
    const val = q.value.trim();
    if (!val){ build(); return; }
    // 展开所有祖先
    collapsed.clear();
    nodes.forEach(n=>{ if (n.d>=2 && n.c && n.c.length) collapsed.add(n.id); });
    nodes.forEach(n=>{ if (n.t.indexOf(val) >= 0){
      let p = n.parent; while(p){ collapsed.delete(p.id); p = p.parent; }
      if (n.c) collapsed.delete(n.id);
    }});
    build();
  });
}

document.addEventListener('DOMContentLoaded', ()=>{
  svg = document.getElementById('svg');
  vg = document.getElementById('view');
  stage = document.getElementById('stage');
  initTabs();
  const hs = location.hash || '';
  if (hs.indexOf('m2') >= 0){
    cur = 1;
    [...document.getElementById('tabs').children].forEach((c,j)=>c.className='tab'+(j===1?' on':''));
  }
  build();
  if (hs.indexOf('all') >= 0){ expandAll(); view = {k: 0.75, x: 20, y: 20}; applyView(); }
  else if (hs.indexOf('l3') >= 0){ toLevel(3); }
  else { toLevel(2); }
  if (hs.indexOf('z1') >= 0){ view = {k: 1, x: 20, y: 20}; applyView(); }
  bindStage();
});
</script>
</body>
</html>
