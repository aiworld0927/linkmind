x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
      tag: "{{.Name}}/{{.ID}}"

x-restart: &default-restart
  restart: unless-stopped

services:
  # 派生图索引：关系查询 / 聚类 / 全文，主数据以 PostgreSQL 为准
  neo4j:
    image: neo4j:5.26.0
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # 主数据存储：仓库登记、地图/节点/属性、Git 审计（5 张业务表）
  postgres:
    image: pgvector/pgvector:pg17
    container_name: linkmind-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkmind}
      POSTGRES_DB: ${POSTGRES_DB:-linkmind}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkmind} -d ${POSTGRES_DB:-linkmind}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    <<: [*default-restart, *default-logging]

  linkmind-backend:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-linkmind}:${POSTGRES_PASSWORD:-linkmind}@postgres:5432/${POSTGRES_DB:-linkmind}
      - KNOWLEDGE_ROOT=/app/knowledge
      # ---- 鉴权与跨域（容器内不读取 backend/.env，必须由 compose 注入）----
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-120}
      - ALLOW_ANONYMOUS=${ALLOW_ANONYMOUS:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-LinkMind}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-linkmind@local}
      - GIT_OPERATION_TIMEOUT=${GIT_OPERATION_TIMEOUT:-60}
      - GIT_MAX_FILE_BYTES=${GIT_MAX_FILE_BYTES:-262144}
      - PYTHONUNBUFFERED=1
    volumes:
      # 知识仓库根目录需可写（真实 Git 提交/合并）
      - ${KNOWLEDGE_HOST_PATH:-../docs/示例知识库}:/app/knowledge
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # 前端静态资源 + 反向代理 /api → backend:8000
  linkmind-web:
    build: ../frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - linkmind-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    <<: [*default-restart, *default-logging]

volumes:
  neo4j-data:
  neo4j-logs:
  pg-data:
