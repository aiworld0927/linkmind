server {
    listen       0.0.0.0:80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- SPA 静态资源 ----
    # HashRouter 下浏览器不发 404 深链请求，try_files 仅兜底；
    # 同时保证 favicon / 原型 demo HTML 可直接访问
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源长缓存（hash 文件名自带版本）
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|map)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }
    }

    # ---- 反向代理 /api 到后端 FastAPI ----
    location /api/ {
        proxy_pass         http://linkmind-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 长连接与超时对齐后端
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
    }

    # 健康检查友好
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
